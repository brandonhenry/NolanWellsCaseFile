<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A sourced, evidence-labeled reconstruction of the Nolan Wells timeline.">
  <meta name="theme-color" content="#060b14">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nolan Wells · Evidence Timeline">
  <meta property="og:description" content="Official records, witness accounts, secondhand summaries, and hypotheses—kept visibly separate.">
  <title>Nolan Wells · Evidence Timeline</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://basemaps.cartocdn.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#story">Skip to timeline</a>

  <div id="map" aria-hidden="true"></div>
  <div id="map-fallback" aria-hidden="true">
    <div class="fallback-coast"></div>
  </div>

  <nav class="top-controls" aria-label="Timeline resources">
    <div class="timeline-menu">
      <button class="control-button" id="timeline-menu-toggle" type="button" aria-controls="timeline-dropdown" aria-expanded="false" aria-haspopup="true">
        <svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 4.8V8l2.4 1.5"/></svg>
        <span>Timeline</span>
      </button>
      <div class="timeline-dropdown" id="timeline-dropdown" aria-hidden="true" aria-labelledby="timeline-menu-toggle">
        <div class="timeline-dropdown-header">
          <p>Confirmed timeline</p>
          <span>Official clock times grouped by hour. Approximate official times are marked with ~.</span>
        </div>
        <div id="confirmed-times-list"></div>
      </div>
    </div>
    <a class="control-link" href="./event-timeline.html" title="Open full evidence log">
      <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3 2.5h10v11H3zM5.5 5h5M5.5 8h5M5.5 11h3"/></svg>
      <span>Event log</span>
    </a>
    <a class="control-link" href="./documents/master-investigation-notes.html" title="Open master investigation notes">
      <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M4 2.5h6l2 2v9H4zM10 2.5v2h2M6 7h4M6 9.5h4"/></svg>
      <span>Master notes</span>
    </a>
    <button class="control-button" type="button" data-panel-target="transcripts-panel" aria-controls="transcripts-panel" aria-expanded="false">
      <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3 2.5h10v11H3zM5.5 5h5M5.5 8h5M5.5 11h3"/></svg>
      <span>Transcripts</span>
    </button>
    <button class="control-button" type="button" data-panel-target="boats-panel" aria-controls="boats-panel" aria-expanded="false">
      <svg class="fill-icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M2 11.5 3.5 7h9l1.5 4.5H2ZM7.5 2h1v5h-1zM8.5 2.5 13 5.3l-4.5.2z"/></svg>
      <span>Boats</span>
    </button>
  </nav>

  <aside class="reference-panel" id="transcripts-panel" aria-hidden="true" aria-labelledby="transcripts-title">
    <div class="panel-header">
      <div><p class="panel-kicker">Source archive</p><h2 id="transcripts-title">Interview transcripts</h2></div>
      <button class="panel-close" type="button" aria-label="Close transcripts panel">×</button>
    </div>
    <div id="transcripts-list" class="panel-list"></div>
  </aside>

  <aside class="reference-panel" id="boats-panel" aria-hidden="true" aria-labelledby="boats-title">
    <div class="panel-header">
      <div><p class="panel-kicker">Vessel reference</p><h2 id="boats-title">Boats in the record</h2></div>
      <button class="panel-close" type="button" aria-label="Close boats panel">×</button>
    </div>
    <div id="boats-list" class="panel-list"></div>
  </aside>

  <main id="story" class="scroll-container" tabindex="-1">
    <noscript>
      <section class="step"><div class="step-content"><p class="step-time">JavaScript required</p><h1 class="step-title">Nolan Wells</h1><p class="step-summary">Enable JavaScript to view the interactive timeline, or open the <a href="./event-timeline.html">plain evidence log</a>.</p></div></section>
    </noscript>
  </main>

  <div class="map-key" aria-hidden="true">
    <span><i class="key-route"></i> MI4088BU schematic route</span>
    <span>Official timestamp anchors · not raw Garmin track</span>
  </div>

  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Expanded evidence image">
    <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close image">×</button>
    <img id="lightbox-image" alt="">
    <p id="lightbox-caption"></p>
  </div>

  <div id="page-status" class="sr-only" role="status" aria-live="polite"></div>

  <script src="./assets/timeline-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script src="./assets/home.js"></script>
</body>
</html>
