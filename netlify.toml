[build]
  publish = "."

[[redirects]]
  from = "https://justicefornolanwells.netlify.app/*"
  to = "https://justicefornolanwells.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/timeline"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/event-timeline"
  to = "/event-timeline.html"
  status = 200

[[redirects]]
  from = "/master-notes"
  to = "/documents/master-investigation-notes.html"
  status = 200

[[redirects]]
  from = "/case-summary"
  to = "/case-summary.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/archive"
  to = "/archive.html"
  status = 200

[[redirects]]
  from = "/plunder-archive"
  to = "/plunder-archive.html"
  status = 200

[[redirects]]
  from = "/ucn-report"
  to = "/ucn-report.html"
  status = 200

[[redirects]]
  from = "/documents"
  to = "/documents.html"
  status = 200

[[redirects]]
  from = "/social-source-ledger"
  to = "/social-source-ledger.html"
  status = 200

[[redirects]]
  from = "/search"
  to = "/search.html"
  status = 200

[[redirects]]
  from = "/people"
  to = "/people.html"
  status = 200

[[redirects]]
  from = "/boats"
  to = "/boats.html"
  status = 200

[[redirects]]
  from = "/last-contact"
  to = "/last-contact.html"
  status = 200

[[redirects]]
  from = "/contradictions"
  to = "/contradictions.html"
  status = 200

[[redirects]]
  from = "/evidence-tracker"
  to = "/evidence-tracker.html"
  status = 200

[[redirects]]
  from = "/coordinates"
  to = "/coordinates.html"
  status = 200

[[redirects]]
  from = "/questions"
  to = "/questions.html"
  status = 200

[[redirects]]
  from = "/gaps"
  to = "/gaps.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/transcripts/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/documents/MDMR-MP2607-0016-report.pdf"
  [headers.values]
    Link = "<https://justicefornolanwells.com/documents/MDMR-MP2607-0016-report.pdf>; rel=\"canonical\""
    X-Robots-Tag = "index, follow"
